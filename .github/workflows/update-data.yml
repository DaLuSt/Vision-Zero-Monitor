name: Update data

on:
  schedule:
    # Every Monday at 06:00 UTC. Official statistics are annual; this only checks for updates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit validated data to main
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      outcome: ${{ steps.pipeline.outputs.outcome }}
      message: ${{ steps.pipeline.outputs.message }}
      legislation: ${{ steps.legislation.outputs.legislation_outcome }}
      commitments: ${{ steps.commitments.outputs.commitments_outcome }}
      new_year: ${{ steps.year.outputs.new_year }}
      latest_period: ${{ steps.year.outputs.latest_period }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock

      - name: Record the latest reference year before the update
        id: before
        run: echo "latest_period=$(python3 -c "import json; print(json.load(open('public/data/latest.json'))['latest_period'] or '')" 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline (fetch → transform → validate → export)
        id: pipeline
        env:
          PIPELINE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The pipeline never replaces data files on failure; it only records the
        # failure in public/data/pipeline_status.json. We continue so that file can
        # be committed, and fail the job at the end.
        run: |
          set +e
          python -m scripts.data_pipeline.run --save-raw data/raw
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          # One sanitised line for the failure alert (newlines stripped so the
          # value cannot inject further step outputs).
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          try:
              msg = json.load(open("public/data/pipeline_status.json", encoding="utf-8")).get("message", "")
          except Exception:
              msg = ""
          print("message=" + " ".join(str(msg).split())[:500])
          PY

      - name: Update legislation register (EUR-Lex metadata, Publications Office SPARQL)
        id: legislation
        # Independent of the statistics: a failure keeps the previous legislation.json
        # and is reported below, without blocking a statistics update.
        run: |
          set +e
          python -m scripts.legislation.run --save-raw data/raw/legislation
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Recalculate commitment targets from the official figures
        id: commitments
        # Curated commitments (data/curated/commitments.json) compared with the latest observations.
        run: |
          set +e
          python -m scripts.commitments.build
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run tests against the new data
        if: steps.pipeline.outputs.outcome == 'success' || steps.legislation.outputs.legislation_outcome == 'success' || steps.commitments.outputs.commitments_outcome == 'success'
        run: python -m pytest -q

      - name: Upload raw source responses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-sources-${{ github.run_id }}
          path: data/raw
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "No data changes; nothing to commit or deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: statistics ${{ steps.pipeline.outputs.outcome }}, legislation ${{ steps.legislation.outputs.legislation_outcome || 'error' }} – refresh $(date -u +%Y-%m-%d)" \
                     -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Detect a new reference year
        # A new year of official statistics (e.g. Eurostat adding 2025) triggers a release
        # below, so each data year gets its own citable version and DOI.
        id: year
        if: steps.commit.outputs.changed == 'true' && steps.pipeline.outputs.outcome == 'success'
        env:
          BEFORE: ${{ steps.before.outputs.latest_period }}
        run: |
          after=$(python3 -c "import json; print(json.load(open('public/data/latest.json'))['latest_period'] or '')")
          echo "latest_period=$after" >> "$GITHUB_OUTPUT"
          if [ -n "$after" ] && [ "$after" != "$BEFORE" ]; then
            echo "New reference year: ${BEFORE:-none} → $after"
            echo "new_year=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_year=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Data update: statistics ${{ steps.pipeline.outputs.outcome || 'error' }}, legislation ${{ steps.legislation.outputs.legislation_outcome || 'error' }}, commitments ${{ steps.commitments.outputs.commitments_outcome || 'error' }}"
            echo ""
            echo '```json'
            cat public/data/pipeline_status.json 2>/dev/null || echo "{}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the pipeline failed
        if: steps.pipeline.outputs.outcome != 'success' && steps.pipeline.outputs.outcome != 'unchanged'
        run: |
          echo "::error::Data pipeline failed; previous valid data were kept. See pipeline_status.json and the log above."
          exit 1

      - name: Fail if the commitments failed
        if: steps.commitments.outputs.commitments_outcome != 'success' && steps.commitments.outputs.commitments_outcome != 'unchanged'
        run: |
          echo "::error::Commitments build failed; the previous commitments.json was kept. See the log above."
          exit 1

      - name: Fail if the legislation register failed
        if: steps.legislation.outputs.legislation_outcome != 'success' && steps.legislation.outputs.legislation_outcome != 'unchanged'
        run: |
          echo "::error::Legislation register update failed; the previous legislation.json was kept. See the log above."
          exit 1

  deploy:
    needs: update
    # Also deploy after a recorded failure so the site shows the failed check.
    if: always() && needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  release:
    # A minor release once the site shows a new reference year; Zenodo then mints its DOI.
    needs: [update, deploy]
    if: needs.update.result == 'success' && needs.deploy.result == 'success' && needs.update.outputs.new_year == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      bump: minor
      reason: "Adds the official road safety statistics for ${{ needs.update.outputs.latest_period }}, published by Eurostat."

  alert:
    # Opens (or comments on) a "data-refresh-failure" issue when the refresh or its
    # deploy fails, and closes it after the next successful run.
    needs: [update, deploy]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Open, update or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPDATE_RESULT: ${{ needs.update.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          OUTCOME: ${{ needs.update.outputs.outcome }}
          MESSAGE: ${{ needs.update.outputs.message }}
          LEGISLATION_OUTCOME: ${{ needs.update.outputs.legislation }}
          COMMITMENTS_OUTCOME: ${{ needs.update.outputs.commitments }}
        run: bash scripts/ci/refresh-alert.sh
