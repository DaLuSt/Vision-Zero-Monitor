name: Release

# Creates a GitHub release of main. Zenodo archives every published release and
# mints a DOI for it, using the metadata in .zenodo.json.
#
# Run by hand (Actions → Release → Run workflow) or called by update-data.yml when
# Eurostat publishes a new reference year. Steps: bump the version in CITATION.cff and
# package.json on the tip of main → merge that commit through a pull request once full
# CI passes on it (scripts/ci/merge-via-pr.sh; protect-main requires this) → tag the
# merge commit and publish the release with notes generated from the merged pull requests.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [minor, patch, major]
        default: minor
      version:
        description: Exact version (X.Y.Z); overrides the bump if set
        type: string
        default: ""
  workflow_call:
    inputs:
      bump:
        type: string
        default: minor
      reason:
        description: One line put above the generated release notes
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # version branch, merge, tag and release
      pull-requests: write # open the version pull request
      actions: write # start CI on the version branch (scripts/ci/merge-via-pr.sh)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: python3 -m scripts.release.prepare --bump "$BUMP" --version "$VERSION" --date "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing tag
        env:
          TAG: v${{ steps.bump.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Merge the version commit into main through a pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: release/v${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git commit -am "release: v$VERSION" -m "Run: $run_url"
          export PR_TITLE="release: v$VERSION"
          export PR_BODY="Version bump for release v$VERSION, from the **Release** run: $run_url"$'\n\n'"Opened and merged by that run once CI passes; the release is tagged on the merge commit."
          bash scripts/ci/merge-via-pr.sh

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          REASON: ${{ inputs.reason }}
        run: |
          notes="Archived on Zenodo with a DOI; all versions: https://doi.org/10.5281/zenodo.23437733"
          if [ -n "$REASON" ]; then notes="$REASON"$'\n\n'"$notes"; fi
          gh release create "v$VERSION" --target "$MERGE_SHA" \
            --title "Vision Zero Monitor $VERSION" --notes "$notes" --generate-notes
          echo "### Released v$VERSION" >> "$GITHUB_STEP_SUMMARY"
